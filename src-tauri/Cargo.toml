[package]
name = "proton-drive-linux-desktop"
version = "1.0.0"
description = "Proton Drive Linux Client Native Desktop Application"
authors = ["AZEIR"]
edition = "2021"

[lib]
name = "proton_drive_linux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
tauri = { version = "^2.0", features = ["tray-icon"] }
tauri-plugin-shell = "^2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
