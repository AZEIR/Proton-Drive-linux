name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS Dependencies
        run: bun install

      - name: Build Proton Sync Binary
        run: bun run build

      - name: Create Release Package
        run: |
          tar -czvf proton-drive-linux.tar.gz release/proton-sync proton-drive-tray.py proton-drive-launcher.sh setup.sh drive.sh uninstall.sh icons/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/proton-sync
            proton-drive-linux.tar.gz
          draft: true
          prerelease: false
          name: "Proton Drive Linux Client ${{ github.ref_name }}"
          body: "Official Proton Drive Linux Native Desktop Client Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
