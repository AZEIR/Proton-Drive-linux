name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Initialize application SDK only
        run: git submodule update --init sdk

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install JS Dependencies
        run: bun install --frozen-lockfile

      - name: Install FUSE 3 build dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Build Proton Sync Binary
        run: bun run build

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json

      - name: Create Release Package
        run: |
          tar -czf proton-drive-linux.tar.gz \
            release/proton-sync release/proton-sync.js release/drive-fuse-sidecar release/node_modules/ \
            release/sbom.spdx.json \
            package.json bun.lockb tsconfig.json \
            src/ scripts/ sdk/ native/ systemd/ \
            proton-drive-tray.py proton-drive-launcher.sh \
            setup.sh drive.sh uninstall.sh icons/ README.md LICENSE
          sha256sum release/proton-sync release/proton-sync.js \
            release/drive-fuse-sidecar release/sbom.spdx.json \
            proton-drive-linux.tar.gz > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/proton-sync
            release/proton-sync.js
            release/drive-fuse-sidecar
            proton-drive-linux.tar.gz
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/proton-sync
            release/proton-sync.js
            release/drive-fuse-sidecar
            release/sbom.spdx.json
            SHA256SUMS
            proton-drive-linux.tar.gz
          draft: true
          prerelease: false
          name: "Drive for Linux ${{ github.ref_name }}"
          body: "Unofficial Linux client built with the Proton Drive SDK. This project is not supported or endorsed by Proton AG."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
