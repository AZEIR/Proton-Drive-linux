name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Initialize application SDK only
        run: git submodule update --init sdk

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install FUSE 3 build dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Run Tests
        run: bun run test

      - name: Check TypeScript Types
        run: bun run check-types

      - name: Audit dependencies
        run: bun audit

      - name: Check Rust sidecar
        run: cargo test --locked --manifest-path native/fuse-sidecar/Cargo.toml

      - name: Build Node daemon
        run: bun run build

      - name: Verify portable bundle
        run: |
          ! grep -F "$GITHUB_WORKSPACE" release/proton-sync.js
          test -x release/proton-sync
          test -s release/proton-sync.js
          test -x release/drive-fuse-sidecar
